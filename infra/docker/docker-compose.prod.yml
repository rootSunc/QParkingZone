services:
  backend:
    build:
      context: ../../apps/api
      dockerfile: ../../infra/docker/backend.Dockerfile
    container_name: parking-zones-backend
    command: sh -lc "php scripts/init-db.php && php -S 0.0.0.0:8000 -t public"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      PARKING_ZONES_AUTO_SEED: "true"
      PARKING_ZONES_DB_PATH: /app/var/zones.sqlite
    expose:
      - "8000"
    restart: unless-stopped
    volumes:
      - parking-zones-data:/app/var
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@file_get_contents(\"http://127.0.0.1:8000/api/health\") === false ? 1 : 0);'"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ../../apps/web
      dockerfile: ../../infra/docker/frontend.Dockerfile
    container_name: parking-zones-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  parking-zones-data:
