services:
  backend:
    build:
      context: ../../apps/api
      dockerfile: ../../infra/docker/backend.Dockerfile
    ports:
      - "8000:80"
    command: sh -lc "php scripts/init-db.php && apache2-foreground"
    environment:
      APP_ENV: development
      APP_DEBUG: "true"
      PARKING_ZONES_AUTO_SEED: "true"
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@file_get_contents(\"http://127.0.0.1/api/health\") === false ? 1 : 0);'"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ../../apps/web
      dockerfile: ../../infra/docker/frontend.Dockerfile
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
