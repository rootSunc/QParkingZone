services:
  backend:
    build:
      context: ../../apps/api
      dockerfile: ../../infra/docker/backend.Dockerfile
    command: sh -lc "php scripts/init-db.php && apache2-foreground"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      PARKING_ZONES_AUTO_SEED: "true"
      PARKING_ZONES_DB_PATH: /app/var/zones.sqlite
    expose:
      - "80"
    restart: unless-stopped
    volumes:
      - parking-zones-data:/app/var
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@file_get_contents(\"http://127.0.0.1/api/health\") === false ? 1 : 0);'"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ../../apps/web
      dockerfile: ../../infra/docker/frontend.Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2.10-alpine
    depends_on:
      frontend:
        condition: service_healthy
    command: ["/bin/sh", "/usr/local/bin/start-caddy.sh"]
    environment:
      DOMAIN: ${DOMAIN}
      WWW_DOMAIN: ${WWW_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    volumes:
      - ../caddy/Caddyfile.tmpl:/etc/caddy/Caddyfile.tmpl:ro
      - ../caddy/start-caddy.sh:/usr/local/bin/start-caddy.sh:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  parking-zones-data:
  caddy-data:
  caddy-config:
